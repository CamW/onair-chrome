<!DOCTYPE html>
<html>
<head>
  <title>On-Air Status</title>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    
    .status {
      font-size: 16px;
      display: flex;
      align-items: center;
    }
    
    .indicator {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 10px;
    }
    
    .active {
      background-color: #F44336;
    }
    
    .inactive {
      background-color: #4CAF50;
    }
    
    .refresh-button {
      background: none;
      border: none;
      cursor: pointer;
      color: #2196F3;
      font-size: 20px;
    }
    
    .refresh-button:hover {
      color: #0b7dda;
    }
    
    .details-container {
      margin-top: 15px;
      border-top: 1px solid #eee;
      padding-top: 10px;
      display: none;
    }
    
    .details-heading {
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .details-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .detail-item {
      padding: 8px;
      border-radius: 4px;
      background-color: #f5f5f5;
      margin-bottom: 6px;
    }
    
    .detail-url {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .detail-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    
    .status-info {
      margin-top: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    
    .status-label {
      font-weight: bold;
    }
    
    .status-value.active {
      color: #F44336;
      font-weight: bold;
      background-color: transparent;
    }
    
    .status-value.inactive {
      color: #4CAF50;
      background-color: transparent;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="status">
      <span id="indicator" class="indicator inactive"></span>
      <span id="statusText">Checking status...</span>
    </div>
    <button id="refreshButton" class="refresh-button" title="Refresh status">↻</button>
  </div>
  
  <div class="status-info">
    <div class="status-item">
      <span class="status-label">WebRTC:</span>
      <span id="webrtcStatus" class="status-value inactive">Not Active</span>
    </div>
    <div class="status-item">
      <span class="status-label">Screen/Camera:</span>
      <span id="mediaStatus" class="status-value inactive">Not Active</span>
    </div>
  </div>
  
  <div>
    <p>This extension detects when your computer is "On Air" due to WebRTC activity (video calls) or screen/camera sharing.</p>
  </div>
  
  <div id="webrtcDetailsContainer" class="details-container">
    <div class="details-heading">Active WebRTC Sessions:</div>
    <ul id="webrtcDetailsList" class="details-list"></ul>
  </div>
  
  <div id="mediaDetailsContainer" class="details-container">
    <div class="details-heading">Active Media Captures:</div>
    <ul id="mediaDetailsList" class="details-list"></ul>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
